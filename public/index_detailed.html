<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Wesype - Services IA Connectés</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .brand-logo {
            font-size: 4rem;
            background: linear-gradient(45deg, #4285f4, #ea4335, #fbbc04, #34a853);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .brand-text {
            font-size: 3rem;
            font-weight: 800;
            color: white;
            text-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .tagline {
            color: rgba(255,255,255,0.9);
            font-size: 1.4rem;
            font-weight: 300;
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .search-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            margin-bottom: 3rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .search-box {
            position: relative;
            margin-bottom: 1rem;
        }

        .search-input {
            width: 100%;
            padding: 1.2rem 1.5rem 1.2rem 4rem;
            border: 2px solid #e9ecef;
            border-radius: 50px;
            font-size: 1.1rem;
            background: white;
            transition: all 0.3s ease;
            outline: none;
        }

        .search-input:focus {
            border-color: #4285f4;
            box-shadow: 0 0 0 3px rgba(66, 133, 244, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 1.5rem;
            top: 50%;
            transform: translateY(-50%);
            color: #6c757d;
            font-size: 1.2rem;
        }

        .search-results {
            display: none;
            margin-top: 1rem;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .service-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .service-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(45deg, #4285f4, #ea4335, #fbbc04, #34a853);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .service-card:hover::before {
            transform: scaleX(1);
        }

        .service-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
        }

        .service-icon {
            font-size: 3rem;
            margin-bottom: 1.5rem;
            color: #4285f4;
        }

        .service-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #2c3e50;
        }

        .service-description {
            color: #6c757d;
            line-height: 1.6;
            margin-bottom: 1rem;
        }

        .service-status {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .status-available {
            background: #e8f5e8;
            color: #27ae60;
        }

        .status-coming-soon {
            background: #fff3cd;
            color: #856404;
        }

        .service-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .tag {
            background: #f8f9fa;
            color: #495057;
            padding: 0.3rem 0.8rem;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .stats-section {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 2rem;
            text-align: center;
        }

        .stat-item {
            padding: 1rem;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 800;
            color: #4285f4;
            margin-bottom: 0.5rem;
        }

        .stat-label {
            color: #6c757d;
            font-weight: 500;
        }

        .footer {
            text-align: center;
            color: rgba(255,255,255,0.8);
            margin-top: 3rem;
        }

        .no-results {
            text-align: center;
            padding: 2rem;
            color: #6c757d;
            display: none;
        }

        @media (max-width: 768px) {
            .brand-text {
                font-size: 2rem;
            }
            
            .brand-logo {
                font-size: 2.5rem;
            }
            
            .services-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="brand">
                <div class="brand-logo">
                    <i class="fas fa-layer-group"></i>
                </div>
                <div class="brand-text">MCP Wesype</div>
            </div>
            <div class="tagline">
                Connectez vos services favoris à votre IA pour des capacités étendues
            </div>
        </div>

        <div class="search-container">
            <div class="search-box">
                <i class="fas fa-search search-icon"></i>
                <input 
                    type="text" 
                    class="search-input" 
                    placeholder="Recherchez un service MCP (ex: Gmail, Outlook, Notion...)"
                    id="searchInput"
                >
            </div>
            <div class="search-results" id="searchResults"></div>
        </div>

        <div class="stats-section" id="statsSection">
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-number" id="totalServices">-</div>
                    <div class="stat-label">Services Disponibles</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="activeConnections">-</div>
                    <div class="stat-label">Connexions Actives</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="serverStatus">-</div>
                    <div class="stat-label">Statut Serveur</div>
                </div>
            </div>
        </div>

        <div class="services-grid" id="servicesGrid">
            <!-- Les services seront chargés dynamiquement -->
        </div>

        <div class="no-results" id="noResults">
            <i class="fas fa-search" style="font-size: 3rem; margin-bottom: 1rem; color: #dee2e6;"></i>
            <h3>Aucun service trouvé</h3>
            <p>Essayez avec d'autres mots-clés</p>
        </div>

        <div class="footer">
            <p>🚀 Propulsé par MCP (Model Context Protocol)</p>
            <p>© 2025 Wesype - Services IA Connectés</p>
        </div>
    </div>

    <script>
        // Configuration des services
        const services = [
            {
                id: 'gmail',
                name: 'Gmail',
                description: 'Lisez, envoyez et gérez vos emails Gmail directement depuis votre IA',
                icon: 'fab fa-google',
                status: 'available',
                tags: ['Email', 'Google', 'Communication'],
                features: ['Lecture d\'emails', 'Envoi de messages', 'Recherche avancée', 'Gestion des libellés']
            },
            {
                id: 'outlook',
                name: 'Outlook',
                description: 'Intégration complète avec Microsoft Outlook et Exchange',
                icon: 'fab fa-microsoft',
                status: 'coming-soon',
                tags: ['Email', 'Microsoft', 'Entreprise'],
                features: ['Emails Outlook', 'Calendrier', 'Contacts', 'Tâches']
            },
            {
                id: 'notion',
                name: 'Notion',
                description: 'Créez, modifiez et recherchez dans vos espaces de travail Notion',
                icon: 'fas fa-file-alt',
                status: 'coming-soon',
                tags: ['Documentation', 'Notes', 'Base de données'],
                features: ['Pages Notion', 'Bases de données', 'Templates', 'Collaboration']
            },
            {
                id: 'axonaut',
                name: 'Axonaut CRM',
                description: 'Gérez vos contacts, opportunités et données CRM avec votre IA',
                icon: 'fas fa-briefcase',
                status: 'coming-soon',
                tags: ['CRM', 'Ventes', 'Gestion'],
                features: ['Contacts', 'Opportunités', 'Facturation', 'Reporting']
            }
        ];

        let allServices = [];
        let serverStats = {};

        // Initialisation au chargement
        window.addEventListener('load', function() {
            loadServerStats();
            displayAllServices();
            setupSearch();
            setInterval(loadServerStats, 30000); // Mise à jour toutes les 30 secondes
        });

        async function loadServerStats() {
            try {
                const response = await fetch('/api/status');
                const stats = await response.json();
                
                serverStats = stats;
                updateStatsDisplay(stats);
                
                // Charger les services disponibles depuis le serveur
                const servicesResponse = await fetch('/api/services');
                const servicesData = await servicesResponse.json();
                
                if (servicesData.success) {
                    updateServicesFromServer(servicesData.services);
                }
            } catch (error) {
                console.error('Erreur chargement stats:', error);
                updateStatsDisplay({ status: 'Offline' });
            }
        }

        function updateStatsDisplay(stats) {
            const totalServicesEl = document.getElementById('totalServices');
            const activeConnectionsEl = document.getElementById('activeConnections');
            const serverStatusEl = document.getElementById('serverStatus');

            if (stats.status === 'OK') {
                totalServicesEl.textContent = stats.services?.total || services.length;
                activeConnectionsEl.textContent = stats.users?.totalUsers || 0;
                serverStatusEl.textContent = '🟢 En ligne';
                serverStatusEl.style.color = '#27ae60';
            } else {
                totalServicesEl.textContent = services.length;
                activeConnectionsEl.textContent = '0';
                serverStatusEl.textContent = '🔴 Hors ligne';
                serverStatusEl.style.color = '#e74c3c';
            }
        }

        function updateServicesFromServer(serverServices) {
            // Mettre à jour le statut des services basé sur les données du serveur
            services.forEach(service => {
                const serverService = serverServices.find(s => s.name === service.id);
                if (serverService) {
                    service.status = serverService.isEnabled ? 'available' : 'coming-soon';
                }
            });
            
            // Redessiner si nécessaire
            const searchInput = document.getElementById('searchInput');
            if (searchInput.value === '') {
                displayAllServices();
            }
        }

        function displayAllServices() {
            allServices = [...services];
            renderServices(allServices);
        }

        function renderServices(servicesToRender) {
            const servicesGrid = document.getElementById('servicesGrid');
            const noResults = document.getElementById('noResults');
            
            if (servicesToRender.length === 0) {
                servicesGrid.style.display = 'none';
                noResults.style.display = 'block';
                return;
            }
            
            servicesGrid.style.display = 'grid';
            noResults.style.display = 'none';
            
            servicesGrid.innerHTML = servicesToRender.map(service => `
                <div class="service-card" onclick="openService('${service.id}')">
                    <div class="service-icon">
                        <i class="${service.icon}"></i>
                    </div>
                    <div class="service-name">${service.name}</div>
                    <div class="service-description">${service.description}</div>
                    <div class="service-status ${service.status === 'available' ? 'status-available' : 'status-coming-soon'}">
                        <i class="fas ${service.status === 'available' ? 'fa-check-circle' : 'fa-clock'}"></i>
                        ${service.status === 'available' ? 'Disponible' : 'Bientôt disponible'}
                    </div>
                    <div class="service-tags">
                        ${service.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                    </div>
                </div>
            `).join('');
        }

        function setupSearch() {
            const searchInput = document.getElementById('searchInput');
            
            searchInput.addEventListener('input', function(e) {
                const query = e.target.value.toLowerCase().trim();
                
                if (query === '') {
                    displayAllServices();
                    return;
                }
                
                const filteredServices = services.filter(service => {
                    return service.name.toLowerCase().includes(query) ||
                           service.description.toLowerCase().includes(query) ||
                           service.tags.some(tag => tag.toLowerCase().includes(query)) ||
                           (service.features && service.features.some(feature => feature.toLowerCase().includes(query)));
                });
                
                renderServices(filteredServices);
            });
        }

        function openService(serviceId) {
            const service = services.find(s => s.id === serviceId);
            
            if (!service) {
                alert('Service non trouvé');
                return;
            }
            
            if (service.status !== 'available') {
                alert(`${service.name} sera bientôt disponible !`);
                return;
            }
            
            // Rediriger vers la page du service
            window.location.href = `/pages/${serviceId}.html`;
        }

        // Gestion du clavier
        document.addEventListener('keydown', function(e) {
            if (e.key === '/' && !document.activeElement.matches('input')) {
                e.preventDefault();
                document.getElementById('searchInput').focus();
            }
        });
    </script>
</body>
</html>
