<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Axonaut Wesype</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .setup-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
        }
        .setup-modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border-radius: 18px;
            padding: 32px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
        }
        .setup-form {
            margin-top: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 8px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.2s;
            background: white;
            color: #1e293b;
        }
        .form-group input:focus {
            outline: none;
            border-color: #2563eb;
        }
        .form-group input::placeholder {
            color: #94a3b8;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }
        .btn {
            flex: 1;
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #2563eb;
            color: white;
        }
        .btn-primary:hover {
            background: #1d4ed8;
        }
        .btn-secondary {
            background: #f1f5f9;
            color: #64748b;
        }
        .btn-secondary:hover {
            background: #e2e8f0;
        }
        .status-message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-weight: 500;
        }
        .status-success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }
        .status-error {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }
        .configured-status {
            background: #dcfce7;
            color: #166534;
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 24px;
            text-align: center;
            font-weight: 600;
        }
    </style>
</head>
<body style="background:#f8fafc;min-height:100vh;">
    <div class="container" style="max-width:480px;margin:48px auto 0 auto;background:#fff;border-radius:18px;box-shadow:0 2px 16px rgba(30,41,59,0.08);padding:48px 32px;">
        <div style="display:flex;align-items:center;gap:18px;margin-bottom:18px;">
            <img src="https://www.axonaut.com/favicon.ico" alt="Axonaut" style="width:56px;height:56px;">
            <h1 style="margin:0;font-size:2em;font-weight:700;color:#1e293b;">MCP Axonaut Wesype</h1>
        </div>
        <div style="color:#64748b;font-size:1.15em;margin-bottom:36px;">
            Synchronisez vos données Axonaut pour une gestion intelligente avec MCP Wesype.
        </div>
        
        <!-- Statut de configuration -->
        <div id="configStatus" style="display: none;"></div>
        
        <button id="setupBtn" style="background:#2563eb;color:#fff;border:none;border-radius:10px;padding:16px 38px;font-size:1.15em;font-weight:600;cursor:pointer;box-shadow:0 2px 8px rgba(30,41,59,0.06);">
            Setup
        </button>
        
        <button id="reconfigureBtn" style="display:none;background:#64748b;color:#fff;border:none;border-radius:10px;padding:16px 38px;font-size:1.15em;font-weight:600;cursor:pointer;box-shadow:0 2px 8px rgba(30,41,59,0.06);margin-left:12px;">
            Reconfigurer
        </button>
    </div>

    <!-- Modal de configuration -->
    <div id="setupModal" class="setup-modal">
        <div class="setup-modal-content">
            <h2 style="margin:0 0 8px 0;font-size:1.5em;color:#1e293b;">Configuration Axonaut</h2>
            <p style="color:#64748b;margin:0 0 24px 0;">Entrez votre clé API Axonaut pour connecter votre compte.</p>
            
            <div id="statusMessage" style="display:none;"></div>
            
            <form id="setupForm" class="setup-form">
                <div class="form-group">
                    <label for="apiKey">Clé API Axonaut</label>
                    <input type="password" id="apiKey" name="apiKey" placeholder="Entrez votre clé API..." required>
                </div>
                
                <div class="btn-group">
                    <button type="button" id="cancelBtn" class="btn btn-secondary">Annuler</button>
                    <button type="submit" id="saveBtn" class="btn btn-primary">Sauvegarder</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Configuration
        const TOOL_NAME = 'axonaut';
        
        // Éléments DOM
        const setupBtn = document.getElementById('setupBtn');
        const reconfigureBtn = document.getElementById('reconfigureBtn');
        const setupModal = document.getElementById('setupModal');
        const setupForm = document.getElementById('setupForm');
        const cancelBtn = document.getElementById('cancelBtn');
        const statusMessage = document.getElementById('statusMessage');
        const configStatus = document.getElementById('configStatus');
        const apiKeyInput = document.getElementById('apiKey');

        // Vérifier le statut de configuration au chargement
        checkConfigurationStatus();

        // Event listeners
        setupBtn.addEventListener('click', openSetupModal);
        reconfigureBtn.addEventListener('click', openSetupModal);
        cancelBtn.addEventListener('click', closeSetupModal);
        setupForm.addEventListener('submit', handleSetupSubmit);
        
        // Fermer la modal en cliquant à l'extérieur
        setupModal.addEventListener('click', (e) => {
            if (e.target === setupModal) {
                closeSetupModal();
            }
        });

        function openSetupModal() {
            setupModal.style.display = 'block';
            apiKeyInput.focus();
            hideStatusMessage();
        }

        function closeSetupModal() {
            setupModal.style.display = 'none';
            setupForm.reset();
            hideStatusMessage();
        }

        function showStatusMessage(message, type) {
            statusMessage.textContent = message;
            statusMessage.className = `status-message status-${type}`;
            statusMessage.style.display = 'block';
        }

        function hideStatusMessage() {
            statusMessage.style.display = 'none';
        }

        async function checkConfigurationStatus() {
            try {
                const token = localStorage.getItem('authToken');
                if (!token) {
                    window.location.href = '/';
                    return;
                }

                const response = await fetch(`/api/mcp/sessions/${TOOL_NAME}/check`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    if (data.hasSession) {
                        showConfiguredStatus();
                    }
                }
            } catch (error) {
                console.error('Erreur lors de la vérification du statut:', error);
            }
        }

        function showConfiguredStatus() {
            configStatus.innerHTML = '✅ Axonaut est configuré et connecté';
            configStatus.className = 'configured-status';
            configStatus.style.display = 'block';
            
            setupBtn.style.display = 'none';
            reconfigureBtn.style.display = 'inline-block';
        }

        async function handleSetupSubmit(e) {
            e.preventDefault();
            
            const apiKey = apiKeyInput.value.trim();
            if (!apiKey) {
                showStatusMessage('Veuillez entrer une clé API', 'error');
                return;
            }

            const saveBtn = document.getElementById('saveBtn');
            saveBtn.disabled = true;
            saveBtn.textContent = 'Sauvegarde...';

            try {
                const token = localStorage.getItem('authToken');
                if (!token) {
                    window.location.href = '/';
                    return;
                }

                const response = await fetch('/api/mcp/sessions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        toolName: TOOL_NAME,
                        accessKey: apiKey
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showStatusMessage('Configuration sauvegardée avec succès!', 'success');
                    setTimeout(() => {
                        closeSetupModal();
                        showConfiguredStatus();
                    }, 1500);
                } else {
                    showStatusMessage(data.error || 'Erreur lors de la sauvegarde', 'error');
                }
            } catch (error) {
                console.error('Erreur:', error);
                showStatusMessage('Erreur de connexion', 'error');
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = 'Sauvegarder';
            }
        }
    </script>
</body>
</html>
