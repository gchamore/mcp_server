<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmail MCP Server - OAuth Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 90%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .logo {
            font-size: 3rem;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #4285f4, #ea4335, #fbbc04, #34a853);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #2c3e50;
        }

        .subtitle {
            color: #7f8c8d;
            margin-bottom: 2rem;
            font-size: 1.1rem;
            font-weight: 400;
        }

        .status-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 2rem;
            margin: 2rem 0;
            border-left: 4px solid #e74c3c;
            transition: all 0.3s ease;
        }

        .status-card.connected {
            border-left-color: #27ae60;
            background: #f0fff4;
        }

        .status-icon {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .status-card .status-icon {
            color: #e74c3c;
        }

        .status-card.connected .status-icon {
            color: #27ae60;
        }

        .login-btn {
            background: linear-gradient(45deg, #4285f4, #34a853);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            min-width: 200px;
            justify-content: center;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(66, 133, 244, 0.3);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .user-info {
            background: #f0fff4;
            border-radius: 15px;
            padding: 1.5rem;
            margin: 1rem 0;
            border: 1px solid #d4edda;
        }

        .user-email {
            font-weight: 600;
            color: #27ae60;
            font-size: 1.1rem;
        }

        .server-info {
            background: #e3f2fd;
            border-radius: 15px;
            padding: 1.5rem;
            margin: 1rem 0;
            border: 1px solid #bbdefb;
        }

        .endpoint-url {
            font-family: 'Monaco', 'Consolas', monospace;
            background: #263238;
            color: #4fc3f7;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            margin: 0.5rem 0;
            word-break: break-all;
            font-size: 0.9rem;
        }

        .loading {
            display: none;
            color: #3498db;
        }

        .loading.show {
            display: inline-block;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 1rem;
            border-radius: 10px;
            margin: 1rem 0;
            border: 1px solid #fcc;
            display: none;
        }

        .success-message {
            background: #efe;
            color: #363;
            padding: 1rem;
            border-radius: 10px;
            margin: 1rem 0;
            border: 1px solid #cfc;
            display: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .loading {
            animation: pulse 1.5s infinite;
        }

        .footer {
            margin-top: 2rem;
            color: #95a5a6;
            font-size: 0.9rem;
        }

        .copy-btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 0.3rem 0.8rem;
            border-radius: 5px;
            font-size: 0.8rem;
            cursor: pointer;
            margin-left: 0.5rem;
            transition: all 0.2s ease;
        }

        .copy-btn:hover {
            background: #2980b9;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <i class="fab fa-google"></i>
        </div>
        
        <h1>Gmail MCP Server</h1>
        <p class="subtitle">Interface OAuth pour DUST AI</p>

        <div id="statusCard" class="status-card">
            <div class="status-icon">
                <i class="fas fa-times-circle"></i>
            </div>
            <h3 id="statusTitle">Non connecté</h3>
            <p id="statusMessage">Cliquez sur "Se connecter" pour authentifier votre compte Gmail</p>
        </div>

        <div id="userInfo" class="user-info" style="display: none;">
            <h4>👤 Compte connecté</h4>
            <div id="userEmail" class="user-email"></div>
        </div>

        <div id="serverInfo" class="server-info" style="display: none;">
            <h4>🚀 Serveur MCP Actif</h4>
            <p>Endpoint pour DUST :</p>
            <div id="endpointUrl" class="endpoint-url"></div>
            <button class="copy-btn" onclick="copyEndpoint()">
                <i class="fas fa-copy"></i> Copier
            </button>
        </div>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <div style="margin: 2rem 0;">
            <button id="loginBtn" class="login-btn" onclick="startOAuth()">
                <i class="fab fa-google"></i>
                <span id="loginText">Se connecter avec Google</span>
                <i id="loadingIcon" class="fas fa-spinner fa-spin loading"></i>
            </button>
        </div>

        <div class="footer">
            <p>🔒 Authentification sécurisée via Google OAuth 2.0</p>
        </div>
    </div>

    <script>
        let checkStatusInterval;

        // Vérifier le statut au chargement
        window.addEventListener('load', function() {
            checkServerStatus();
            checkStatusInterval = setInterval(checkServerStatus, 3000);
        });

        async function checkServerStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                
                updateUI(data);
            } catch (error) {
                console.error('Erreur lors de la vérification du statut:', error);
            }
        }

        function updateUI(status) {
            const statusCard = document.getElementById('statusCard');
            const statusTitle = document.getElementById('statusTitle');
            const statusMessage = document.getElementById('statusMessage');
            const userInfo = document.getElementById('userInfo');
            const serverInfo = document.getElementById('serverInfo');
            const loginBtn = document.getElementById('loginBtn');
            const loginText = document.getElementById('loginText');

            if (status.connected) {
                statusCard.classList.add('connected');
                statusCard.querySelector('.status-icon').innerHTML = '<i class="fas fa-check-circle"></i>';
                statusTitle.textContent = 'Connecté à Gmail';
                statusMessage.textContent = 'Service Gmail opérationnel';
                
                userInfo.style.display = 'block';
                serverInfo.style.display = 'block';
                document.getElementById('userEmail').textContent = status.userEmail || 'Email non disponible';
                document.getElementById('endpointUrl').textContent = status.endpoint || 'Endpoint non disponible';
                
                loginText.textContent = 'Reconnexion';
                loginBtn.style.background = 'linear-gradient(45deg, #27ae60, #2ecc71)';
            } else {
                statusCard.classList.remove('connected');
                statusCard.querySelector('.status-icon').innerHTML = '<i class="fas fa-times-circle"></i>';
                statusTitle.textContent = 'Non connecté';
                statusMessage.textContent = status.error || 'Cliquez sur "Se connecter" pour authentifier votre compte Gmail';
                
                userInfo.style.display = 'none';
                serverInfo.style.display = 'none';
                
                loginText.textContent = 'Se connecter avec Google';
                loginBtn.style.background = 'linear-gradient(45deg, #4285f4, #34a853)';
            }
        }

        async function startOAuth() {
            const loginBtn = document.getElementById('loginBtn');
            const loginText = document.getElementById('loginText');
            const loadingIcon = document.getElementById('loadingIcon');
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');

            // UI loading state
            loginBtn.disabled = true;
            loginText.textContent = 'Connexion en cours...';
            loadingIcon.classList.add('show');
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';

            try {
                const response = await fetch('/api/auth/start', {
                    method: 'POST'
                });
                
                const data = await response.json();
                
                if (data.success && data.authUrl) {
                    
                    // Ouvrir la popup OAuth
                    const popup = window.open(data.authUrl, 'googleOAuth', 'width=500,height=600,scrollbars=yes,resizable=yes');
                    
                    // Surveiller la fermeture de la popup
                    const checkClosed = setInterval(function() {
                        if (popup.closed) {
                            clearInterval(checkClosed);
                            // Vérifier le statut après fermeture
                            setTimeout(checkServerStatus, 1000);
                            resetButton();
                        }
                    }, 1000);
                } else {
                    throw new Error(data.error || 'Erreur lors du démarrage OAuth');
                }
            } catch (error) {
                console.error('Erreur OAuth:', error);
                errorMessage.textContent = 'Erreur: ' + error.message;
                errorMessage.style.display = 'block';
                resetButton();
            }
        }

        function resetButton() {
            const loginBtn = document.getElementById('loginBtn');
            const loginText = document.getElementById('loginText');
            const loadingIcon = document.getElementById('loadingIcon');

            loginBtn.disabled = false;
            loginText.textContent = 'Se connecter avec Google';
            loadingIcon.classList.remove('show');
        }

        function copyEndpoint() {
            const endpointUrl = document.getElementById('endpointUrl').textContent;
            navigator.clipboard.writeText(endpointUrl).then(function() {
                const successMessage = document.getElementById('successMessage');
                successMessage.textContent = 'Endpoint copié dans le presse-papiers !';
                successMessage.style.display = 'block';
                setTimeout(() => {
                    successMessage.style.display = 'none';
                }, 3000);
            });
        }
    </script>
</body>
</html>
